<div id="dtr-member-live">
  <div id="dtr-member-stats"
       data-today="{{ today_hours_display }}"
       data-week="{{ week_hours_display }}"
       hidden aria-hidden="true"></div>

  <div id="dtr-my-recent-live">
    {% if recent_entries %}
    <section class="dtr-recent">
      <h2 class="dtr-section-title">Recent entries</h2>
      <div class="dtr-table-wrap">
        <table class="dtr-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>In</th>
              <th>Out</th>
              <th>Hours</th>
              <th>Status</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>
            {% for entry in recent_entries %}
            {% include 'dtr/_timesheet_row.html' with entry=entry %}
            {% endfor %}
          </tbody>
        </table>
      </div>
      <a href="{% url 'dtr_timesheet' %}" class="dtr-view-all">View full timesheet →</a>
    </section>
    {% endif %}
  </div>
</div>
